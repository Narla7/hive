services:
  evolve:
    build: .
    image: hive:latest
    # Override the command for a quick run, e.g.
    #   docker compose run --rm evolve --generations 4 --quiet
    command: ["--population", "16", "--generations", "12", "--episodes", "6"]
    environment:
      # Only needed when --model is not offline/rules.
      HIVE_API_KEY: "${HIVE_API_KEY:-}"
      HIVE_BASE_URL: "${HIVE_BASE_URL:-https://openrouter.ai/api/v1}"
    volumes:
      - ./runs:/app/runs
    # Uncomment to attach a real market-data file.
    # - ./data:/app/data:ro

  # The TUI needs a real terminal: `docker compose run --rm evolve --tui`
  # with an interactive stdin, i.e. run it without -d.

  test:
    build: .
    image: hive:latest
    entrypoint: ["python", "-m", "unittest", "discover", "-s", "tests", "-t", "."]
    command: []
