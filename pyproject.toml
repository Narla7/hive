[project]
name = "progeny"
version = "0.1.0"
description = "PROGENY: an evolutionary harness for day-trading agents. Fitness is realized net P&L."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
progeny = "progeny.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
